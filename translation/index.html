<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown 英訳トレーニング | なんざんホーム</title>
    <meta name="description" content="Crownの日本語を英訳して、原文との違いを確認できるトレーニングです。範囲選択と回答履歴に対応しています。">
    <link rel="canonical" href="https://soucrak.f5.si/translation/">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;icon_names=menu">
    <script>
        if (location.hostname === "soucrak12345.github.io") {
            location.replace("https://soucrak.f5.si" + location.pathname + location.search + location.hash);
        }
    </script>
    <style>
        :root { --site-header-height: 5rem; }
        body { overflow: hidden; }
        .training-main {
            position: fixed;
            inset: var(--site-header-height) 0 0;
            margin: 0;
            padding: 0;
        }
        .training-frame { display: block; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>
    <div class="header"></div>
    <main class="training-main">
        <iframe class="training-frame" src="app.html" title="Crown 英訳トレーニング"></iframe>
    </main>
    <script src="/header.js"></script>
    <script>
        // 共通タイトルバーの実際の高さに合わせて、学習画面の領域を確保する。
        const siteHeader = document.querySelector('.header');
        new ResizeObserver(() => {
            const height = siteHeader.getBoundingClientRect().height;
            if (height > 0) {
                document.documentElement.style.setProperty('--site-header-height', `${height}px`);
            }
        }).observe(siteHeader);
    </script>
</body>
</html>
