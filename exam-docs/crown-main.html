<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crown Main</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');

        body {

            border-width: 2px 0;
            margin: 20px;
            padding: 10px;
        }

        .questions-container {

        }

        p.quote{
            margin-left: 20px;
            padding: 5px 20px;
            border-left: 2px solid black;
        }

        h2{
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <div class="main-text"></div>
    <div class="questions-container">
        <ol class="questions_ol"></ol>
    </div>
    <h2>答え</h2>
    <div class="answers-container">
        <ol class="answers_ol"></ol>

        question_data.questions.forEach(element => {

            li.innerHTML = element.text;
            if (Object.keys(element).includes("sentence_with_blank")) {

                p.classList.add("quote");

        const answers_ol = document.querySelector(".answers_ol");
        question_data.questions.forEach(element => {

</body>

</html>
